<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#082d63"><title>Administrator Preview · Gifted Brainz EduSpace</title>
<link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/typography.css"><link rel="icon" href="/assets/favicon.ico"><style>
body{background:#f5f8fd;color:#142a48}.preview-wrap{max-width:1150px;margin:0 auto;padding:18px clamp(12px,3vw,30px) 75px}
.preview-head{background:linear-gradient(115deg,#082d63,#1760a8);border-radius:20px;padding:22px;color:white;margin-bottom:18px;display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.preview-head h1{margin:0 0 4px;font-size:clamp(1.25rem,3vw,1.9rem)}.preview-note{font-size:.86rem;color:#e0e9f8}.preview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px}.preview-card{background:#fff;border:1px solid #dde6f3;border-radius:17px;padding:17px;box-shadow:0 4px 16px #10325a0b}.preview-card h3{margin:4px 0 8px;font-size:1.04rem}.preview-card .chip{display:inline-block;background:#e9f3ff;color:#164d86;border-radius:30px;padding:4px 9px;font-size:.75rem;font-weight:750}.preview-card p{font-size:.9rem;line-height:1.6}.preview-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.preview-tabs button{border:1px solid #d4e2f3;background:#fff;color:#163961;padding:10px 13px;border-radius:11px;font-weight:700;cursor:pointer}.preview-tabs button.active{background:#1259a0;color:white}.preview-modal{position:fixed;inset:0;background:#091832d9;z-index:100;display:none;align-items:center;justify-content:center;padding:14px}.preview-modal.open{display:flex}.preview-box{width:min(900px,100%);max-height:90dvh;overflow:auto;background:white;border-radius:18px;padding:20px}.preview-content{overflow-wrap:anywhere;line-height:1.75}.preview-content img{max-width:100%}.preview-content iframe{max-width:100%}.preview-stat{color:#576a82;font-size:.8rem;margin:0 0 10px}.preview-card a{word-break:break-word}.preview-head a{background:white;color:#082d63;padding:10px 15px;border-radius:10px;text-decoration:none;font-weight:750}
@media(max-width:480px){.preview-head{padding:16px;border-radius:15px}.preview-card{padding:13px}.preview-tabs button{font-size:.84rem}}
</style><link rel="stylesheet" href="/brand-gold-v1221.css?v=12.21.0"></head><body><div class="preview-wrap"><header class="preview-head"><div><small>GIFTED BRAINZ EDUSPACE</small><h1>Administrator Student-Portal Preview</h1><div class="preview-note">View all subjects, public and premium content. Read-only · Not a student account.</div></div><a href="/admin.html">← Admin Console</a></header><div id="notice" role="status">Loading the full learning catalogue…</div><nav id="tabs" class="preview-tabs" aria-label="Preview sections"></nav><main id="list" class="preview-grid"></main></div><div class="preview-modal" id="modal"><div class="preview-box"><button type="button" id="close" class="btn light" style="float:right">Close</button><h2 id="modalTitle"></h2><div id="modalContent" class="preview-content"></div></div></div><script src="/app.js"></script><script src="/api.js"></script><script src="/gb-ui.js"></script><script>
const output=document.getElementById('list'),tab=document.getElementById('tabs'),note=document.getElementById('notice');let data,section='materials';const esc=s=>GBUI.esc(String(s||''));
const sections=[['materials','Learning Materials'],['videos','Video Lessons'],['cbts','CBT Tests'],['topics','Topics'],['subjects','All Subjects']];
function draw(){tab.innerHTML=sections.map(([id,label])=>`<button data-view="${id}" class="${section===id?'active':''}">${label}</button>`).join('');const rows=section==='subjects'?(data.subjects||[]).map(name=>({name,title:name,subject:name,accessLevel:'public'})):(data[section]||[]);
output.innerHTML=rows.map((r,i)=>`<article class="preview-card"><span class="chip">${esc(r.subject)}</span> ${r.accessLevel==='restricted'?'<span class="chip">Premium</span>':'<span class="chip">Public</span>'}<h3>${esc(r.title||r.name)}</h3>${r.description?`<p>${esc(String(r.description).replace(/<[^>]*>/g,'').slice(0,160))}</p>`:''}<button class="btn light" data-item="${i}">Preview</button></article>`).join('')||'<p>No content in this section yet.</p>';
}
function view(i){const rows=section==='subjects'?(data.subjects||[]).map(name=>({name,title:name,subject:name})):(data[section]||[]);const r=rows[i];if(!r)return;document.getElementById('modalTitle').textContent=r.title||r.name;let text=section==='materials'?(GBUI.renderBody(r.body||'', 'html')+GBUI.media((r.attachments||[]).filter(f=>['image','video','audio'].includes(GBUI.kindOf(f))))+GBUI.files((r.attachments||[]).filter(f=>!['image','video','audio'].includes(GBUI.kindOf(f))))):section==='videos'?`<p>${esc(r.description?.replace(/<[^>]+>/g,'')||'Video lesson')}</p>${r.youtubeUrl?`<a href="${esc(r.youtubeUrl)}" target="_blank" rel="noopener">Watch video on YouTube</a>`:''}`:section==='cbts'?`<p>${esc(r.description||'Online assessment')}</p>${r.linkUrl?`<a href="${esc(r.linkUrl)}" target="_blank" rel="noopener">Open CBT</a>`:''}`:`<p>Subject: ${esc(r.subject)}</p>`;document.getElementById('modalContent').innerHTML=text;document.getElementById('modal').classList.add('open');}
tab.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){section=b.dataset.view;draw()}});output.addEventListener('click',e=>{const b=e.target.closest('[data-item]');if(b)view(Number(b.dataset.item))});document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.target.classList.remove('open')};
(async()=>{try{data=await GB.api('/api/admin/preview-catalog');note.textContent=`All ${data.subjects.length} subjects available · Administrator preview`;draw();GB.api('/api/files/ticket',{method:'POST'}).catch(()=>{});}catch(e){note.textContent='Administrator sign-in required. '+e.message;output.innerHTML='<a href="/admin.html">Open Admin Console</a>'}})();
</script></body></html>
