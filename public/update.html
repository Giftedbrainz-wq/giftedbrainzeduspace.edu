<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#082d63">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/favicon.ico">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<title>Update • Gifted Brainz Tutorial</title>
<link rel="stylesheet" href="/styles.css?v=12.21.0"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/typography.css?v=12.21.0">
<link rel="stylesheet" href="/v1218-corrections.css?v=12.21.0"><link rel="stylesheet" href="/brand-gold-v1221.css?v=12.21.0"></head>
<body>
<div class="network-banner" id="networkBanner"></div>
<div id="shell"><div class="main">
  <div class="topbar">
    <div class="page-title"><span class="ic">🔄</span> Latest Update</div>
    <div class="topbar-right"><span class="who" id="who"></span><button class="btn light" onclick="GB.logout()">Log out</button></div>
  </div>
  <div class="content">
    <div class="hero-banner">
      <div class="eyebrow">Gifted Brainz Tutorial</div>
      <h1 id="title">Update applied successfully</h1>
      <p>The latest version has been installed automatically. Your account, CBT records and portal information remain intact.</p>
    </div>
    <div class="card" id="details"><p class="muted">Checking the live version…</p></div>
    <div class="factions" style="margin-top:14px">
      <a class="btn primary" href="/dashboard.html">Continue to dashboard →</a>
      <a class="btn light" href="/announcements.html">View announcements</a>
    </div>
  </div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script><script src="/app.js?v=12.21.0"></script><script src="/api.js?v=12.21.0"></script><script src="/gb-ui.js?v=12.21.0"></script>
<script>
if(!GB.token()) location="/login.html";
GBUI.mount({active:"/dashboard.html"});
(async()=>{
  const $=id=>document.getElementById(id);
  const wanted=new URLSearchParams(location.search).get("version")||"";
  try{
    const u=await GB.api("/api/app/update");
    const version=u?.version||wanted||"latest";
    $("title").textContent="Version "+version+" is live";
    $("details").innerHTML=
      '<div class="notice"><b>Update complete ✅</b><br>'+
      GBUI.esc(u?.notes||"The latest Gifted Brainz Tutorial update is now active on this device.")+
      '<br><small class="muted">Published '+GBUI.esc(u?.date?new Date(u.date).toLocaleString():"just now")+'</small></div>';
  }catch(e){
    $("details").innerHTML='<p class="error">'+GBUI.esc(e.message)+'</p>';
  }
})();
</script>
</body>
</html>
